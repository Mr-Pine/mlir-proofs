name = "rir-firedancer"
defaultTargets = ["Firedancer"]

# Firedancer's ed25519 verify (ref), lifted to the register-based IR and proved.
[[require]]
name = "MLIR"
path = "../lean-mlir-nightly-port"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4-nightly-testing"
rev = "nightly-testing-2026-09-16"

[[lean_lib]]
name = "Firedancer"
# every module, not just the root's imports
globs = ["Firedancer.+"]
