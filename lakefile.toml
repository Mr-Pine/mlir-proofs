name = "rir-firedancer"
defaultTargets = ["Firedancer"]
# Mathlib is built once, in the dependency's checkout: share its packages.
packagesDir = "../lean-mlir-nightly-port/.lake/packages"

# The register-based IR: lifts, semantics and proof tactics.
[[require]]
name = "MLIR"
path = "../lean-mlir-nightly-port"

# The framework no longer brings Mathlib: required here, at its nightly-2026-09-16 tag.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4-nightly-testing"
rev = "nightly-testing-2026-09-16"

# Ed25519 as mathematics: the field, the curve's group, SHA-512, decoding.
[[lean_lib]]
name = "Ed25519"
globs = ["Ed25519.+"]

# Limb objects in RIR memory, and proof tactics over them.
[[lean_lib]]
name = "Common"
globs = ["Common.+"]

[[lean_lib]]
name = "Firedancer"
# every module, not just the root's imports
globs = ["Firedancer.+"]

# Zig's std.crypto ed25519 verify, lifted from zig-build/ and proved.
[[lean_lib]]
name = "Zig"
globs = ["Zig.+"]
